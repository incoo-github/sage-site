<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sage - key system</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0a0a0f;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .bg {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        radial-gradient(ellipse at 20% 50%, rgba(0, 180, 255, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 50%, rgba(0, 255, 120, 0.06) 0%, transparent 50%);
      z-index: 0;
    }

    .grid {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 520px;
      margin: 0 auto;
      padding: 120px 24px 80px;
    }

    .logo-section {
      text-align: center;
      margin-bottom: 48px;
    }

    .logo-section img {
      height: 36px;
      filter: drop-shadow(0 0 12px rgba(0,180,255,0.3));
      margin-bottom: 20px;
    }

    .logo-section h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #00b4ff, #00ff88);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .logo-section p {
      color: #667;
      font-size: 1.05rem;
    }

    .input-group {
      position: relative;
      margin-bottom: 20px;
    }

    .input-group input {
      width: 100%;
      padding: 16px 20px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      color: #fff;
      font-size: 1.1rem;
      font-family: 'Courier New', monospace;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      outline: none;
      transition: all 0.3s;
    }

    .input-group input:focus {
      border-color: rgba(0,180,255,0.4);
      background: rgba(0,180,255,0.04);
      box-shadow: 0 0 20px rgba(0,180,255,0.1);
    }

    .input-group input::placeholder {
      color: #445;
      letter-spacing: 1px;
      text-transform: none;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .btn {
      width: 100%;
      padding: 14px 24px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #00b4ff, #0090cc);
      color: #fff;
      box-shadow: 0 4px 15px rgba(0,180,255,0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(0,180,255,0.4);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result {
      margin-top: 24px;
      padding: 20px;
      border-radius: 12px;
      display: none;
    }

    .result.show { display: block; }

    .result.valid {
      background: rgba(0,255,120,0.08);
      border: 1px solid rgba(0,255,120,0.2);
    }

    .result.invalid {
      background: rgba(255,60,60,0.08);
      border: 1px solid rgba(255,60,60,0.2);
    }

    .result-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .result.valid .result-title { color: #00ff88; }
    .result.invalid .result-title { color: #ff4444; }

    .result-detail {
      color: #889;
      font-size: 0.9rem;
    }

    .result-detail span {
      color: #aab;
      font-weight: 600;
    }

    .steps {
      margin-top: 48px;
      padding: 24px;
      background: rgba(255,255,255,0.02);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .steps h3 {
      font-size: 0.9rem;
      color: #556;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 16px;
    }

    .step {
      display: flex;
      gap: 12px;
      margin-bottom: 14px;
      align-items: flex-start;
    }

    .step:last-child { margin-bottom: 0; }

    .step-num {
      width: 28px;
      height: 28px;
      background: rgba(0,180,255,0.1);
      border: 1px solid rgba(0,180,255,0.2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
      color: #00b4ff;
      flex-shrink: 0;
    }

    .step-text {
      color: #889;
      font-size: 0.9rem;
      line-height: 28px;
    }

    .step-text strong { color: #bbc; }

    .footer {
      text-align: center;
      margin-top: 60px;
      color: #334;
      font-size: 0.8rem;
    }

    .footer a {
      color: #00b4ff;
      text-decoration: none;
    }

    @media (max-width: 600px) {
      .container { padding: 80px 16px 60px; }
      .logo-section h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="grid"></div>

  <div class="container">
    <div class="logo-section">
      <img src="/sage-logo.png" alt="sage">
      <h1>sage</h1>
      <p>validate your key to get started</p>
    </div>

    <div class="input-group">
      <input type="text" id="keyInput" placeholder="enter your key..." maxlength="128" autocomplete="off" spellcheck="false">
    </div>

    <button class="btn btn-primary" id="validateBtn" onclick="validateKey()">validate key</button>

    <div class="result" id="result">
      <div class="result-title" id="resultTitle"></div>
      <div class="result-detail" id="resultDetail"></div>
    </div>

    <div class="steps">
      <h3>how to use</h3>
      <div class="step">
        <div class="step-num">1</div>
        <div class="step-text"><strong>download</strong> sage_loader.exe from the releases</div>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <div class="step-text"><strong>open</strong> sage_loader.exe and paste your key</div>
      </div>
      <div class="step">
        <div class="step-num">3</div>
        <div class="step-text"><strong>launch</strong> roblox and join a game</div>
      </div>
      <div class="step">
        <div class="step-num">4</div>
        <div class="step-text">the loader will <strong>detect</strong> roblox and launch sage automatically</div>
      </div>
    </div>

    <div class="footer">
      <a href="/">home</a> &middot; sage &copy; 2026
    </div>
  </div>

  <script>
    document.getElementById('keyInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') validateKey();
    });

    async function validateKey() {
      const key = document.getElementById('keyInput').value.trim();
      const result = document.getElementById('result');
      const title = document.getElementById('resultTitle');
      const detail = document.getElementById('resultDetail');
      const btn = document.getElementById('validateBtn');

      if (!key) {
        result.className = 'result show invalid';
        title.textContent = 'enter a key';
        detail.innerHTML = '';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'checking...';
      result.className = 'result';

      try {
        const resp = await fetch('/api/validate?key=' + encodeURIComponent(key));
        const data = await resp.json();

        if (data.valid) {
          result.className = 'result show valid';
          title.textContent = 'key valid';
          detail.innerHTML = `
            <div>status: <span>${data.status || 'active'}</span></div>
            ${data.username ? '<div>user: <span>' + data.username + '</span></div>' : ''}
          `;
        } else {
          result.className = 'result show invalid';
          title.textContent = data.message || 'invalid key';
          detail.innerHTML = '';
        }
      } catch (err) {
        result.className = 'result show invalid';
        title.textContent = 'connection error';
        detail.innerHTML = 'unable to reach server';
      }

      btn.disabled = false;
      btn.textContent = 'validate key';
    }
  </script>
</body>
</html>
