<!DOCTYPE html><html lang="en"><head>  <meta charset="utf-8"/>  <meta name="viewport" content="width=device-width, initial-scale=1"/>  <title>Sage Menu</title>  <meta name="description" content="Sage External — the best cheap, undetected external. Pay with Robux."/>  <meta property="og:title" content="Sage Menu"/>  <meta property="og:description" content="Cheap. Undetected. Pay with Robux."/>  <style>    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;border-radius:0!important}    :root{--font:#ffffff;--main:#1c1c1c;--bg:#050505;--accent:oklch(0.85 0.12 195);--accent_dark:oklch(0.2 0.05 195);--outline:#323232;--black:#000000;--muted:oklch(0.97 0.01 190/40%);--muted2:oklch(0.97 0.01 190/70%);--risk:#ff3232;--stroke:-1px 0 0 #000,1px 0 0 #000,0 -1px 0 #000,0 1px 0 #000;--h:20px;--nav-h:26px;--gap:4px;--pad:8px;}    html{scroll-behavior:smooth}    body{background:var(--bg);color:var(--font);font-family:Consolas,Tahoma,monospace;font-size:13px;line-height:1.35;overflow-x:hidden;-webkit-font-smoothing:none;-moz-osx-font-smoothing:unset;text-rendering:optimizeSpeed}    ::-webkit-scrollbar{width:3px;height:3px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--accent)}
    @keyframes glow{0%,100%{opacity:.15;transform:scale(1)}50%{opacity:.3;transform:scale(1.1)}}    @keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}    @keyframes petal-fall{0%{transform:translate3d(0,-10vh,0) rotate(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translate3d(var(--drift,100px),110vh,0) rotate(720deg);opacity:0}}    @keyframes petal-sway{0%,100%{margin-left:0}50%{margin-left:40px}}
    .ts{background:linear-gradient(90deg,oklch(.95 .02 190),var(--accent) 50%,oklch(.95 .02 190));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 4s linear infinite}
    .pw{pointer-events:none;position:fixed;inset:0;z-index:0;overflow:hidden}    .pt{position:absolute;top:0;background:radial-gradient(circle at 30% 30%,oklch(0.95 0.15 195),oklch(0.85 0.2 190) 60%,oklch(0.7 0.22 185));border-radius:50% 50% 50% 0 !important;filter:drop-shadow(0 2px 6px oklch(0.8 0.2 195/.6));will-change:transform,opacity}
    .gw{pointer-events:none;position:fixed;inset:0;z-index:-1}    .g1{position:absolute;top:-160px;left:-160px;height:500px;width:500px;border-radius:9999px !important;background:oklch(.75 .15 195);opacity:.1;filter:blur(120px);animation:glow 6s ease-in-out infinite}    .g2{position:absolute;top:33%;right:-160px;height:600px;width:600px;border-radius:9999px !important;background:oklch(.65 .18 185);opacity:.08;filter:blur(140px);animation:glow 8s ease-in-out infinite 2s}    .g3{position:absolute;bottom:0;left:33%;height:400px;width:400px;border-radius:9999px !important;background:oklch(.7 .16 190);opacity:.07;filter:blur(120px);animation:glow 7s ease-in-out infinite 1s}
    .pg{position:relative;z-index:10;height:100vh;display:flex;flex-direction:column;justify-content:space-between}    .ct{max-width:1152px;margin:0 auto;padding:0 1.5rem;width:100%}
    nav{display:flex;align-items:center;justify-content:space-between;padding:1.5rem;max-width:1152px;margin:0 auto;width:100%;height:80px}
    .hero{padding:1rem 1.5rem;text-align:center;margin:auto}    h1{margin-top:1.5rem;font-size:clamp(3rem,10vw,5.5rem);font-weight:700;letter-spacing:-.05em;line-height:1}    .hs{margin:1.25rem auto 0;max-width:36rem;font-size:1.125rem;color:var(--muted2)}    .hb{margin-top:2rem;display:flex;align-items:center;justify-content:center;gap:var(--gap);flex-wrap:wrap}
    
    .ui_btn_outer{display:inline-block;background:var(--black);border:1px solid var(--black);cursor:pointer;text-decoration:none;color:var(--font);font-family:inherit;font-size:13px;line-height:0;vertical-align:top;appearance:none;-webkit-appearance:none;padding:0;margin:0}
    button.ui_btn_outer{font:inherit}
    .ui_btn_outer:hover{border-color:var(--muted)}
    .ui_btn_inner{display:block;position:relative;min-width:64px;height:var(--h);line-height:var(--h);padding:0 8px;background:var(--main);box-shadow:inset 0 0 0 1px var(--outline);text-align:center;white-space:nowrap;user-select:none;text-shadow:var(--stroke);z-index:0;font-size:12px;overflow:hidden;text-overflow:ellipsis}
    .ui_btn_inner::before{content:"";position:absolute;inset:1px;background:linear-gradient(180deg,rgba(255,255,255,.07) 0%,rgba(212,212,212,.025) 100%);pointer-events:none}
    
    .b1{display:inline-block}
    .b1 .ui_btn_inner{min-width:90px;height:28px;line-height:28px;color:var(--muted2)}
    .b1:hover .ui_btn_inner{color:var(--font);background:oklch(1 0 0/5%)}
    
    .b2{display:inline-block}
    .b2 .ui_btn_inner{min-width:90px;height:28px;line-height:28px;color:var(--muted2)}
    .b2:hover .ui_btn_inner{color:var(--font);background:oklch(1 0 0/5%)}

    footer{border-top:1px solid var(--outline);padding:1.5rem;text-align:center;font-size:.875rem;color:var(--muted);max-width:1152px;margin:0 auto;width:100%}
    .frame_accent{height:1px;background:var(--accent);flex-shrink:0;line-height:0}
    
    .toast{position:fixed;bottom:16px;left:16px;z-index:999;max-width:360px;background:var(--black);border:1px solid var(--black);opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s;pointer-events:none;line-height:normal}
    .toast.show{opacity:1;transform:none}
    .toast_inner{background:var(--main);box-shadow:inset 0 0 0 1px var(--outline);padding:6px 10px 6px 14px;position:relative;font-size:12px;text-shadow:var(--stroke)}
    .toast_inner::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
    .toast.error .toast_inner::before{background:var(--risk)}
    
    .discord-banner{position:fixed;bottom:20px;right:20px;z-index:998;background:var(--black);border:1px solid var(--black);width:260px}
    .discord-banner-inner{background:var(--main);box-shadow:inset 0 0 0 1px var(--outline);padding:14px;position:relative;font-size:12px;text-shadow:var(--stroke)}
    .discord-banner-inner::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
    .discord-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
    .discord-title-wrap{display:flex;align-items:center;gap:8px}
    .discord-icon{width:16px;height:16px;flex-shrink:0;fill:var(--accent)}
    .discord-close{background:transparent;border:none;color:var(--outline);cursor:pointer;font-family:inherit;font-size:13px;padding:0 2px;transition:color .2s}
    .discord-close:hover{color:var(--font)}
    .discord-body{line-height:1.4;color:var(--muted2)}
    .discord-link{display:block;margin-top:6px;color:var(--accent);text-decoration:underline}
    .discord-link:hover{opacity:.8}
  </style></head><body>
<div class="pw" id="petals"></div>
<div class="gw">
  <div class="g1"></div>
  <div class="g2"></div>
  <div class="g3"></div>
</div>
<div class="pg">
  <nav></nav>
  <section class="hero ct">
    <h1><span class="ts">Sage</span></h1>
    <p class="hs">External Menu for Roblox.</p>
    <div class="hb">
      <button type="button" onclick="showToast('Sage is currently in maintenance.', 'error')" class="ui_btn_outer b1">
        <span class="ui_btn_inner">Loader</span>
      </button>
      <a href="https://discord.gg/getsage" target="_blank" rel="noopener noreferrer" class="ui_btn_outer b2">
        <span class="ui_btn_inner">Discord</span>
      </a>
    </div>
  </section>
  <footer>Sage @2026</footer>
</div>
<div id="toast" class="toast">
  <div class="toast_inner" id="toast_msg">Sage is currently in maintenance.</div>
</div>
<div id="discord_banner" class="discord-banner">
  <div class="discord-banner-inner">
    <div class="discord-header">
      <div class="discord-title-wrap">
        <svg class="discord-icon" viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
        <span style="font-weight:bold">Discord</span>
      </div>
      <button class="discord-close" onclick="document.getElementById('discord_banner').remove()">✕</button>
    </div>
    <div class="discord-body">
      Join our Discord server for updates and support.
      <a href="https://discord.gg/getsage" target="_blank" rel="noopener noreferrer" class="discord-link">https://discord.gg/getsage</a>
    </div>
  </div>
</div>
<script>
  let toastTimer;

  function showToast(message, type) {
    const t = document.getElementById('toast');
    const m = document.getElementById('toast_msg');
    m.textContent = message;
    t.className = 'toast ' + type;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
  }

  (function() {
    const container = document.getElementById('petals');
    const fragment = document.createDocumentFragment();
    
    for (let i = 0; i < 25; i++) {
      const petal = document.createElement('span');
      petal.className = 'pt';
      const size = 8 + Math.random() * 14;
      const drift = (Math.random() - 0.5) * 300;
      const duration = 8 + Math.random() * 10;
      const swayDuration = 2 + Math.random() * 3;
      const delay = Math.random() * -15;
      
      petal.style.cssText = `left: ${Math.random() * 100}%; width: ${size}px; height: ${size}px; --drift: ${drift}px; animation: petal-fall ${duration}s linear ${delay}s infinite, petal-sway ${swayDuration}s ease-in-out ${delay}s infinite alternate;`;
      fragment.appendChild(petal);
    }
    
    container.appendChild(fragment);
  })();
</script></body></html>
