<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;border-radius:0!important}
    :root{
      --font:#ffffff;
      --main:#1c1c1c;
      --bg:#141414;
      --accent:#818cf8;
      --outline:#323232;
      --black:#000000;
      --muted:#969696;
      --muted2:#bebebe;
      --stroke:-1px 0 0 #000,1px 0 0 #000,0 -1px 0 #000,0 1px 0 #000;
      --h:20px;
      --nav-h:26px;
      --gap:4px;
      --pad:8px;
    }
    body{background:var(--bg);color:var(--font);font-family:Consolas,Tahoma,monospace;font-size:13px;line-height:1.35;overflow:hidden;height:100vh}
    
    /* Landing Section */
    #page_landing{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:var(--pad)}
    .landing_stack{width:460px;max-width:100%}
    .landing_banner_outer{background:var(--black);border:1px solid var(--black)}
    .landing_banner_inner{background:var(--main);box-shadow:inset 0 0 0 1px var(--outline);padding:40px;text-align:center}
    .frame_accent{height:1px;background:var(--accent);flex-shrink:0}
    .landing_buttons{display:flex;gap:var(--gap);justify-content:center;margin-top:var(--gap)}
    
    /* Buttons & Inputs */
    .ui_btn_outer{display:inline-block;background:var(--black);border:1px solid var(--black);cursor:pointer;text-decoration:none;color:var(--font);font-family:inherit;font-size:13px}
    .ui_btn_outer:hover{border-color:var(--muted)}
    .ui_btn_inner{display:block;position:relative;height:var(--h);line-height:var(--h);padding:0 12px;background:var(--main);box-shadow:inset 0 0 0 1px var(--outline);text-align:center;font-size:12px}
    .lbl{text-shadow:var(--stroke)}

    /* Dashboard UI */
    #page_dashboard{display:none;height:100vh;width:100vw;background:var(--bg)}
    .dash_window{height:100%;width:100%;display:flex;flex-direction:column}
    .dash_inner{flex:1;display:flex;flex-direction:column;background:var(--main);box-shadow:inset 0 0 0 1px var(--outline)}
    .dash_titlebar{height:var(--nav-h);display:flex;align-items:center;padding:0 var(--pad);border-bottom:1px solid var(--outline);gap:var(--gap)}
    .dash_titlebar_spacer{flex:1}
    
    /* Workspace Area */
    .dash_main{flex:1;margin:var(--pad);display:flex;flex-direction:column;gap:var(--pad)}
    .dash_panel{flex:1;border:1px solid var(--black);background:var(--main);box-shadow:inset 0 0 0 1px var(--outline);padding:var(--pad)}
  </style>
</head>
<body>

  <!-- Landing View -->
  <div id="page_landing">
    <div class="landing_stack">
      <div class="landing_banner_outer">
        <div class="landing_banner_inner">
          <div class="frame_accent"></div>
          <h1 style="font-size:20px;text-shadow:var(--stroke);margin-top:15px">SYSTEM PANEL</h1>
          <p style="color:var(--muted);font-size:11px;margin-top:5px">Next level solution.</p>
        </div>
      </div>
      <div class="landing_buttons">
        <button type="button" class="ui_btn_outer" onclick="enterDashboard()"><span class="ui_btn_inner lbl">Login</span></button>
        <a href="https://discord.com" target="_blank" class="ui_btn_outer"><span class="ui_btn_inner lbl">Discord</span></a>
      </div>
    </div>
  </div>

  <!-- Dashboard View (Hidden by default) -->
  <div id="page_dashboard">
    <div class="dash_window">
      <div class="dash_inner">
        <div class="frame_accent"></div>
        <div class="dash_titlebar">
          <span style="font-size:12px;text-shadow:var(--stroke)">Dashboard v1.0</span>
          <div class="dash_titlebar_spacer"></div>
          <button type="button" class="ui_btn_outer" onclick="exitDashboard()"><span class="ui_btn_inner">Logout</span></button>
        </div>
        <div class="dash_main">
          <div class="dash_panel">
            <h2 style="font-size:14px;text-shadow:var(--stroke);margin-bottom:8px">Welcome</h2>
            <p style="color:var(--muted2);font-size:12px">Your workspace is active and securely online.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function enterDashboard() {
      document.getElementById('page_landing').style.display = 'none';
      document.getElementById('page_dashboard').style.display = 'block';
    }
    function exitDashboard() {
      document.getElementById('page_dashboard').style.display = 'none';
      document.getElementById('page_landing').style.display = 'flex';
    }
  </script>
</body>
</html>
