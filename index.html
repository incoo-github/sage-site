<script>
let toastTimer;
function showToast(message, type){
  const t=document.getElementById('toast'),m=document.getElementById('toast_msg');
  m.textContent=message;
  t.className='toast '+type;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),3000);
}
// Optimized Petal generation (reduced count to 25 and used DocumentFragment)
(function(){
  const c=document.getElementById('petals'),frag=document.createDocumentFragment();
  for(let i=0;i<25;i++){
    const e=document.createElement('span');e.className='pt';
    const s=8+Math.random()*14,dr=(Math.random()-.5)*300,du=8+Math.random()*10,sw=2+Math.random()*3,dl=Math.random()*-15;

    frag.appendChild(e);
  }
  c.appendChild(frag);
