<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sage Menu</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2"/>
  <link rel="icon" type="image/png" href="/sage-logo.png"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;border-radius:0!important}
    :root{
      --font:#ffffff;
      --main:#1c1c1c;
      --bg:#141414;
      --accent:#818cf8;
      --outline:#323232;
      --black:#000000;
      --muted:#969696;
      --muted2:#bebebe;
      --risk:#ff3232;
      --stroke:-1px 0 0 #000,1px 0 0 #000,0 -1px 0 #000,0 1px 0 #000;
      --h:20px;
      --nav-h:26px;
      --gap:4px;
      --pad:8px;
    }
    body{background:var(--bg);color:var(--font);font-family:Consolas,Tahoma,monospace;font-size:13px;line-height:1.35;overflow:hidden;height:100vh}
    
    #page_landing{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:var(--pad)}
    .landing_stack{width:460px;max-width:100%}
    .landing_banner_outer{background:var(--black);border:1px solid var(--black)}
    .landing_banner_inner{background:var(--main);box-shadow:inset 0 0 0 1px var(--outline);padding:20px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:180px}
    .frame_accent{height:1px;background:var(--accent);flex-shrink:0;width:100%;margin-bottom:15px}
    
    .landing_image{max-width:80%;height:auto;margin:10px 0}

    .landing_buttons{display:flex;gap:var(--gap);justify-content:center;margin-top:var(--gap)}
    
    .ui_btn_outer{display:inline-block;background:var(--black);border:1px solid var(--black);cursor:pointer;text-decoration:none;color:var(--font);font-family:inherit;font-size:13px}
    .ui_btn_outer:hover{border-color:var(--muted)}
    .ui_btn_inner{display:block;position:relative;height:var(--h);line-height:var(--h);padding:0 12px;background:var(--main);box-shadow:inset 0 0 0 1px var(--outline);text-align:center;font-size:12px}
    .lbl{text-shadow:var(--stroke)}

    .toast{position:fixed;bottom:16px;left:16px;z-index:999;max-width:360px;background:var(--black);border:1px solid var(--black);opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s;pointer-events:none;line-height:normal}
    .toast.show{opacity:1;transform:none}
    .toast_inner{background:var(--main);box-shadow:inset 0 0 0 1px var(--outline);padding:6px 10px 6px 14px;position:relative;font-size:12px;text-shadow:var(--stroke)}
    .toast_inner::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
    .toast.error .toast_inner::before{background:var(--risk)}
    .toast.success .toast_inner::before{background:#4ade80}
  </style>
</head>
<body>

  <div id="page_landing">
    <div class="landing_stack">
      <div class="landing_banner_outer">
        <div class="landing_banner_inner">
          <div class="frame_accent"></div>
          
          <img src="/sage-logo.png" alt="Sage Logo" class="landing_image"/>
          
        </div>
      </div>
      <div class="landing_buttons">
        <button type="button" class="ui_btn_outer" onclick="showToast('Sage is currently in maintenance.', 'error')"><span class="ui_btn_inner lbl">Download</span></button>
        <a href="https://discord.gg/getsage" target="_blank" class="ui_btn_outer"><span class="ui_btn_inner lbl">Discord</span></a>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">
    <div class="toast_inner" id="toast_msg"></div>
  </div>

  <script>
    let toastTimer;
    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      const m = document.getElementById('toast_msg');
      m.textContent = msg;
      t.className = 'toast ' + type + ' show';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        t.className = 'toast';
      }, 3500);
    }
  </script>

</body>
</html>
